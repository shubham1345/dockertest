name: Build and Deploy .NET Docker App to Azure

on:
  push:
    branches:
      - master  # Triggers the workflow on pushes to the main branch

env:
  ACR_LOGIN_SERVER: fstcontreg.azurecr.io
  IMAGE_NAME: dotnet-docker-app
  AZURE_WEBAPP_NAME: docapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the source code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Log into Azure Container Registry
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Build and Tag the Docker image
    - name: Build and Tag Docker Image
      run: |
        docker build ./dockertest -f ./dockertest/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
        
    # 4. Push the Docker image to ACR
    - name: Push Image to ACR
      run: |
        docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

    # 5. Deploy the image to Azure App Service
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
